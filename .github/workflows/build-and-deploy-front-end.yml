name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Client WebAssembly app
        run: dotnet publish SartainStudios.Client/SartainStudios.Client.csproj -c Release -o publish /p:BaseHref="/"

      - name: Generate build info
        run: |
          cat <<EOF > publish/wwwroot/build-info.json
          {
            "buildDateUtc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commitMessage": ${{ toJson(github.event.head_commit.message) }}
          }
          EOF

      - name: Add .nojekyll file
        run: touch publish/wwwroot/.nojekyll

      - name: Add CNAME file
        run: echo "sartainstudios.com" > publish/wwwroot/CNAME

      - name: Add SPA fallback page
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4